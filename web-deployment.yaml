apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-secret-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-secret-web
  template:
    metadata:
      labels:
        app: config-secret-web
    spec:
      serviceAccountName: config-secret-web
      automountServiceAccountToken: false
      containers:
        - name: web
          image: config-secret-app:1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
